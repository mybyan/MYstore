<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769aa"><title>MYstore POS · 138 Produk</title>
<style>
:root{--blue:#1769aa;--dark:#124d80;--bg:#f3f6fb;--line:#e1e8f0;--text:#203247;--muted:#718096;--green:#16834b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif;padding-bottom:76px}
header{background:var(--blue);color:white;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:48px;height:48px;object-fit:contain;border-radius:11px;background:#fff;box-shadow:0 2px 8px #07365b55}.brand-copy{min-width:0}.logo{font-size:22px;font-weight:800;line-height:1.1}.sub{font-size:11px;opacity:.9;margin-top:4px}
main{max-width:1100px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}
.tabs button,.btn{border:0;border-radius:9px;padding:10px 13px;background:#e6f0fa;color:var(--blue);font-weight:700;white-space:nowrap}
.tabs button.active,.primary{background:var(--blue);color:white}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #18395a0a}
h2{font-size:18px;margin:4px 0 14px}h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat{background:#f7faff;border-radius:10px;padding:12px}.muted{color:var(--muted);font-size:12px}.big{font-size:21px;font-weight:800;margin-top:7px}
input,select{width:100%;padding:11px;border:1px solid #ccd7e3;border-radius:9px;background:white;font:inherit;min-width:0}
label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button{cursor:pointer}.product-row,.cart-row,.sale-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.product-row:last-child,.cart-row:last-child{border:0}
.name{font-weight:700}.price{font-size:12px;color:var(--muted);margin-top:4px}
.smallbtn{padding:7px 10px;border:0;border-radius:8px;background:#e6f0fa;color:var(--blue);font-weight:700}
.danger{background:#fff0f0;color:#b42318}.total{font-size:23px;font-weight:800}
.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:24px 8px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:6}
.bottom button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px}.bottom button.active{color:var(--blue);font-weight:bold}
.bottom span{display:block;font-size:19px;margin-bottom:3px}
#notice{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#203247;color:white;padding:10px 15px;border-radius:9px;z-index:10;display:none;max-width:90%;text-align:center}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.bottom{position:static;max-width:1100px;margin:10px auto;border:1px solid var(--line);border-radius:12px}}
</style></head>

 db.products=seedProducts;

let cart=[];
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{products:[],sales:[]}}catch(e){return{products:[],sales:[]}}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function rupiah(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(s){let n=document.getElementById('notice');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',2200)}
function go(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='kasir')renderCashProducts();if(id==='produk')renderProducts();if(id==='transaksi')renderSales();window.scrollTo(0,0)}
function resetForm(){['editId','code','barcode','pname','price','stock'].forEach(x=>document.getElementById(x).value='');document.getElementById('formTitle').textContent='Tambah produk'}
function saveProduct(){let id=editId.value,codeV=code.value.trim(),bar=barcode.value.trim(),name=pname.value.trim(),pr=Number(price.value),st=Number(stock.value);if(!name||!Number.isFinite(pr)||pr<0||!Number.isFinite(st)||st<0){notice('Isi nama, harga, dan stok dengan benar');return}if(db.products.some(p=>(p.code===codeV&&codeV||p.barcode===bar&&bar)&&p.id!==id)){notice('Kode atau barcode sudah digunakan');return}if(id){let p=db.products.find(x=>x.id===id);Object.assign(p,{code:codeV,barcode:bar,name,price:pr,stock:st})}else db.products.push({id:String(Date.now()),code:codeV,barcode:bar,name,price:pr,stock:st});resetForm();saveDB();notice('Produk berhasil disimpan')}
function editProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;editId.value=p.id;code.value=p.code;barcode.value=p.barcode;pname.value=p.name;price.value=p.price;stock.value=p.stock;formTitle.textContent='Ubah produk';window.scrollTo(0,0)}
function deleteProduct(id){if(!confirm('Hapus produk ini?'))return;db.products=db.products.filter(p=>p.id!==id);saveDB();notice('Produk dihapus')}
function renderProducts(){let q=(productSearch.value||'').toLowerCase();let a=db.products.filter(p=>[p.name,p.code,p.barcode].join(' ').toLowerCase().includes(q));productList.innerHTML=a.length?a.map(p=>`<div class="product-row"><div><div class="name">${esc(p.name)}</div><div class="price">${esc(p.code)} · ${esc(p.barcode)} · Stok ${p.stock} · ${rupiah(p.price)}</div></div><div style="white-space:nowrap"><button class="smallbtn" onclick="editProduct('${p.id}')">Edit</button> <button class="smallbtn danger" onclick="deleteProduct('${p.id}')">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada produk. Tambahkan produk di formulir atas.</div>'}
function renderCashProducts(){let q=(cashSearch.value||'').toLowerCase();let a=db.products.filter(p=>[p.name,p.code,p.barcode].join(' ').toLowerCase().includes(q)&&p.stock>0).slice(0,20);cashProducts.innerHTML=a.map(p=>`<div class="product-row"><div><div class="name">${esc(p.name)}</div><div class="price">${rupiah(p.price)} · Stok ${p.stock}</div></div><button class="smallbtn" onclick="addCart('${p.id}')">Tambah</button></div>`).join('')||'<div class="empty">Produk tidak ditemukan atau stok habis.</div>'}
function addBySearch(){let q=cashSearch.value.trim().toLowerCase();let p=db.products.find(p=>p.barcode.toLowerCase()===q||p.code.toLowerCase()===q||p.name.toLowerCase()===q);if(p){addCart(p.id);cashSearch.value='';renderCashProducts()}}
function addCart(id){let p=db.products.find(x=>x.id===id);if(!p)return;let c=cart.find(x=>x.id===id);if((c?.qty||0)>=p.stock){notice('Jumlah melebihi stok');return}if(c)c.qty++;else cart.push({id,qty:1});renderCart()}
function changeQty(id,d){let c=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);else if(c.qty>p.stock){c.qty=p.stock;notice('Stok tidak mencukupi')}renderCart()}
function total(){return cart.reduce((s,c)=>s+(db.products.find(p=>p.id===c.id)?.price||0)*c.qty,0)}
function renderCart(){cartList.innerHTML=cart.length?cart.map(c=>{let p=db.products.find(x=>x.id===c.id);return p?`<div class="cart-row"><div style="min-width:0"><div class="name">${esc(p.name)}</div><div class="price">${rupiah(p.price)} × ${c.qty}</div></div><div style="white-space:nowrap"><button class="smallbtn" onclick="changeQty('${c.id}',-1)">−</button> ${c.qty} <button class="smallbtn" onclick="changeQty('${c.id}',1)">＋</button></div></div>`:''}).join(''):'<div class="empty">Keranjang masih kosong</div>';cartTotal.textContent=rupiah(total());renderChange()}
function renderChange(){let diff=Number(paid.value||0)-total();change.textContent=rupiah(Math.max(0,diff))}
payment.addEventListener('change',()=>{cashFields.classList.toggle('hidden',payment.value!=='Tunai')});
function checkout(){if(!cart.length){notice('Keranjang masih kosong');return}let sum=total(),method=payment.value,received=method==='Tunai'?Number(paid.value||0):sum;if(method==='Tunai'&&received<sum){notice('Uang diterima belum cukup');return}let items=cart.map(c=>{let p=db.products.find(x=>x.id===c.id);return{id:p.id,name:p.name,price:p.price,qty:c.qty}});items.forEach(i=>{let p=db.products.find(x=>x.id===i.id);p.stock-=i.qty});db.sales.unshift({id:'TRX'+Date.now(),date:new Date().toISOString(),items,total:sum,payment:method,paid:received,change:received-sum});cart=[];paid.value='';saveDB();renderCart();notice('Transaksi berhasil disimpan');go('transaksi')}
function renderSales(){salesList.innerHTML=db.sales.length?db.sales.map(s=>`<div class="sale-row"><div><div class="name">${s.id}</div><div class="price">${new Date(s.date).toLocaleString('id-ID')} · ${esc(s.payment)} · ${s.items.length} jenis barang</div></div><b>${rupiah(s.total)}</b></div>`).join(''):'<div class="empty">Belum ada transaksi penjualan.</div>'}
function renderAll(){let today=new Date().toDateString(),ss=db.sales.filter(s=>new Date(s.date).toDateString()===today);todaySales.textContent=rupiah(ss.reduce((a,s)=>a+s.total,0));todayCount.textContent=ss.length;productCount.textContent=db.products.length;lowStock.textContent=db.products.filter(p=>p.stock<=5).length;recentSales.innerHTML=db.sales.slice(0,5).map(s=>`<div class="sale-row"><span>${s.id}</span><b>${rupiah(s.total)}</b></div>`).join('')||'<div class="empty">Belum ada transaksi.</div>';renderProducts();renderSales();renderCart()}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MYstore-backup.json';a.click();URL.revokeObjectURL(a.href)}
renderAll();
